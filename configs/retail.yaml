# Synthesis config (filled in progressively by PLAN Steps 2-6).
domain: retail
seed: 0

tau2:
  tag: v1.0.1
  commit: fc0055dc4e0a316c3f83133267fbd6faaa770992

llm:
  # One backbone for all synthesis roles, as in the blog (model is our choice; blog's is unnamed).
  model: openai/qwen3.7-max  # exact gateway ID uses OpenAI-compatible adapter
  temperature: 0.0
  api_base: http://10.130.138.46:8010/v1
  max_tokens: 16000
  cache_dir: data/cache/llm

user_simulator:
  model: same_as_llm        # [BLOG] one frontier model for all LLM roles, incl. user simulator
  temperature: 0.0

evolution:
  max_depth: 4
  generations: 5
  candidates_per_generation: 20
  depth0_per_atomic_action: 3
  stressors: [chain, multi_entity, policy_pushback, conditional, underspecified, reasoning]

rework:
  rounds_per_batch: 5       # [INDEPENDENT] budget; unrepaired tasks go to rework_queue, not dropped

verifier:
  e2e_reachability: true    # E8, required (PLAN Step 3)
  e2e_trials: 2

reward_basis_allowed: [[DB], [DB, COMMUNICATE]]
checkpoint_verified_tasks: 50    # PLAN Step 6: pause for human review here
target_verified_tasks: 600       # [BLOG] "roughly 600 verified tasks per domain"
